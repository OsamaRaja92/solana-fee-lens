name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      # The suite runs against recorded fixtures, so CI needs no RPC endpoint
      # and no secrets.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
